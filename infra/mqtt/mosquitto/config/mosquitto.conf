# SIDRU — Mosquitto config (LAN de demo).
# NOTA: acceso anónimo SOLO para desarrollo local en LAN de confianza. La autenticación
# por password_file (RNF-IOT-02) y TLS (RNF-IOT-09) quedan como hardening pre-producción.
# (Se usó anónimo por un problema de permisos del bind-mount del passwd en Docker Desktop Windows.)

listener 1883 0.0.0.0

# --- Autenticación (deshabilitada en dev local) ---
allow_anonymous true
# password_file /mosquitto/config/passwd

# --- Persistencia (mensajes retenidos / QoS) ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# --- Logs ---
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
