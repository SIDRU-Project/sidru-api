# ---------------------------------------------------------------------------
# Perfil de pruebas automatizadas (casos CP001-CP046).
#
# Objetivo: que `./mvnw test` corra hermetico en cualquier maquina y en CI, sin
# PostgreSQL, sin broker MQTT, sin Firebase y sin red blockchain.
#
# Es un PERFIL (application-test.properties), no un application.properties: asi se
# superpone al de src/main en vez de reemplazarlo, y solo hay que declarar aqui lo
# que cambia. Se activa con @ActiveProfiles("test") (ver CpIntegrationTest).
# ---------------------------------------------------------------------------

# Base de datos en memoria (H2 en modo PostgreSQL) en vez del Postgres de dev.
spring.datasource.url=jdbc:h2:mem:sidru_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Integraciones externas apagadas: los CP que las tocan mockean el bean concreto.
sidru.mqtt.enabled=false
sidru.firebase.enabled=false
sidru.blockchain.enabled=false

# El job de reconciliacion no debe dispararse durante los tests.
sidru.blockchain.reconciliation.initial-delay-ms=3600000
sidru.blockchain.reconciliation.interval-ms=3600000

# Rate limit alto: los CP lanzan muchas peticiones seguidas desde la misma IP
# (CP029 crea 50 sesiones) y no deben chocar con el filtro RNF-07.
sidru.security.rate-limit.requests-per-minute=100000
sidru.security.rate-limit.max-auth-failures=100000
sidru.security.rate-limit.block-seconds=1

# Secreto JWT fijo de pruebas (no es un secreto real: solo vive en este archivo).
authorization.jwt.secret=test-only-secret-WG75r3R6Z2pYBnq8tNk4mLwVcUaQfPdHsJyXxKbEgF5T7C9D3uMoSeAhqHGNI4vYZx
authorization.jwt.expiration.days=7

# Semilla HD de pruebas (mnemonico publico de ejemplo, jamas usado en produccion).
sidru.blockchain.wallet-master-seed=test test test test test test test test test test test junk

logging.level.com.sidru=WARN
logging.level.com.sidru.access=WARN
logging.level.org.hibernate.SQL=WARN
